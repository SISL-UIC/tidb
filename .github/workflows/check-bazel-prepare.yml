name: Check Bazel Prepare
permissions:
  contents: read
concurrency:
  group: check-bazel-prepare-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    name: Check Bazel Prepare
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      with:
        go-version: 1.25
        cache: false
    - name: Set up Bazelisk
      uses: bazel-contrib/setup-bazel@8310a45e30297e76bc8fbae427fb6068efa01eb8
      with:
        bazelisk-cache: false
        repository-cache: false
        external-cache: false
    - name: Check Bazel Prepare
      shell: bash
      run: |
        set -euo pipefail
        # Avoid the TiDB CI path that assumes Jenkins-owned temp directories.
        unset CI
        make check-bazel-prepare
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  pull_request:
    branches:
    - master
